
name: Deploy ParkSync Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parksync-frontend/package-lock.json

      - name: Install dependencies
        working-directory: parksync-frontend
        run: npm ci

      - name: Build frontend
        working-directory: parksync-frontend
        run: npm run build

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: parksync-frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
